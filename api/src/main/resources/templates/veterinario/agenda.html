<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <title>Minha agenda - ClyvoVet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <h1>Minha agenda</h1>
    <p class="mensagem-sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>

    <table>
        <thead>
        <tr>
            <th>Data/hora</th>
            <th>Pet</th>
            <th>Tutor</th>
            <th>Tipo</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="consulta : ${consultas}">
            <td th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${consulta.pet.nome}"></td>
            <td th:text="${consulta.pet.tutor.nome}"></td>
            <td th:text="${consulta.tipoConsulta}"></td>
            <td th:text="${consulta.statusConsulta}"></td>
            <td>
                <a class="botao" th:href="@{/app/veterinario/consultas/{id}/atender(id=${consulta.id})}">Atender</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(consultas)}">Nenhuma consulta pendente na sua agenda.</p>
</main>
</body>
</html>
