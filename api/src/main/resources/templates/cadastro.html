<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <title>Cadastrar - ClyvoVet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="login-container">
    <div class="cartao">
        <h1>🐾 ClyvoVet</h1>
        <p>Crie sua conta de tutor.</p>

        <p class="mensagem-erro" th:if="${erroCadastro}" th:text="${erroCadastro}"></p>

        <form th:action="@{/cadastro}" th:object="${form}" method="post">

            <div class="form-grupo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
            </div>

            <div class="form-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-grupo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></p>
            </div>

            <div class="form-grupo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></p>
            </div>

            <div class="form-grupo">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" th:field="*{dataNascimento}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></p>
            </div>

            <div class="form-grupo">
                <label for="logradouro">Logradouro</label>
                <input type="text" id="logradouro" th:field="*{logradouro}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></p>
            </div>

            <div class="form-grupo">
                <label for="numero">Número</label>
                <input type="text" id="numero" th:field="*{numero}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></p>
            </div>

            <div class="form-grupo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" th:field="*{complemento}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></p>
            </div>

            <div class="form-grupo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" th:field="*{bairro}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></p>
            </div>

            <div class="form-grupo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" th:field="*{cidade}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></p>
            </div>

            <div class="form-grupo">
                <label for="estado">Estado (UF)</label>
                <input type="text" id="estado" th:field="*{estado}" maxlength="2"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></p>
            </div>

            <div class="form-grupo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" th:field="*{cep}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></p>
            </div>

            <div class="form-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
            </div>

            <div class="form-grupo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}"/>
                <p class="erro-campo" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></p>
            </div>

            <button type="submit" class="botao">Cadastrar</button>
        </form>

        <p style="margin-top:1rem;"><a th:href="@{/login}">Já tem conta? Entrar</a></p>
    </div>
</main>
</body>
</html>
