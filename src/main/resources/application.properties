spring.application.name=clyvovet

# ============================================
# Configuração do Oracle
# Local: usa Oracle da FIAP (fallback)
# Azure: usa variáveis de ambiente do container
# ============================================
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${ORACLE_USER:rm563358}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Senha local (fora do versionamento)
spring.config.import=optional:classpath:application-local.properties

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Cache
# ============================================
spring.cache.type=simple

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ============================================
# Logging
# ============================================
logging.level.br.com.fiap.clyvovet=DEBUG